[build]
  functions = "netlify/functions"
  publish = "."

# اجازه می‌دهد فرانت‌اند به‌جای آدرس طولانی
# /.netlify/functions/chat از مسیر ساده /api/chat استفاده کند
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
